<!doctype html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logiciels IUT informatique</title>
    <meta charset="utf-8" />
    <link href="css/styles.min.css" rel="stylesheet" />
    <link href="css/index.min.css" rel="stylesheet" />
</head>
<body>    
 
    <main class="vertical-layout">
        <h2 class="center">Bienvenue sur le site de gestion des logiciels du département informatique !</h2>
        

 

    <!-- login -->
  <div class="login-container">
    <h2>Connexion</h2>
    <div >
      <label for="user">Utilisateur</label>
      <input type="text" id="user" name="user" required>

      <label for="pass">Mot de passe</label>
      <input type="password" id="pass" name="pass" required>
      <button type="submit">Se connecter</button>
    </div>
  </div>
            
      <!-- ENV-08 : lazy loading sur les images non visibles au chargement -->
  <div class="slides">                
      <img src="img/iut1.jpg" alt="" class="active">
      <img src="img/iut2.jpg" alt="" loading="lazy">
      <img src="img/iut3.jpeg" alt="" loading="lazy">
      <img src="img/iut4.jpg" alt="" loading="lazy">
  </div>            

  </main>
    <!-- Nag screen -->
  <div class="nag-overlay" id="nagScreen">
    <div class="nag-box">
      <div class="nag-title">Un petit instant…</div>
      <div class="nag-text">
        Nous préparons votre espace.  
        Merci de patienter quelques secondes .
      </div>      
    </div>
  </div>

  

    <div w3-include-html="footer.html"></div>

    <script src="js/utils.min.js"></script>
    <script src="js/views/index.min.js"></script>
    <script src="js/lib/jquery.js"></script>
    <script src="js/models/Utilisateur.min.js"></script>
    <script src="js/sgbd/UtilisateurStorage.min.js"></script>
    <script src="js/sgbd/UtilisateurDao.min.js"></script>
    <script src="js/sgbd/Login.min.js"></script>
    </body>
</html>
